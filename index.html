<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Studio | Professional Resume Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Shell -->
        <aside class="editor-sidebar">
            <header class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">✨</span>
                    <h1 id="label-app-title">CV Studio</h1>
                </div>
                <p id="label-app-subtitle">Build your professional presence.</p>
                <div class="language-dropdown">
                    <select id="lang-select">
                        <option value="en" selected>English</option>
                        <option value="uz_lat">O'zbekcha (Lotin)</option>
                        <option value="uz_cyr">Ўзбекча (Кирилл)</option>
                        <option value="ru">Русский</option>
                    </select>
                </div>
            </header>

            <form id="cv-form" class="editor-form">
                <!-- Personal Information -->
                <section class="form-section">
                    <div class="section-title">
                        <h2 id="label-personal-info">Personal Info</h2>
                    </div>
                    <div class="input-grid">
                        <div class="input-group full-width">
                            <label for="profile-photo" id="label-photo">Profile Photo</label>
                            <input type="file" id="profile-photo" accept="image/*">
                        </div>
                        <div class="input-group">
                            <label for="full-name" id="label-name">Full Name</label>
                            <input type="text" id="full-name" placeholder="John Doe" autocomplete="name">
                        </div>
                        <div class="input-group">
                            <label for="job-title" id="label-job-title">Job Title</label>
                            <input type="text" id="job-title" placeholder="Senior Product Designer">
                        </div>
                        <div class="input-group">
                            <label for="email" id="label-email">Email</label>
                            <input type="email" id="email" placeholder="john@example.com">
                        </div>
                        <div class="input-group">
                            <label for="phone" id="label-phone">Phone</label>
                            <input type="tel" id="phone" placeholder="+1 (555) 000-0000">
                        </div>
                        <div class="input-group full-width">
                            <label for="location" id="label-location">Location</label>
                            <input type="text" id="location" placeholder="New York, NY">
                        </div>
                        <div class="input-group full-width">
                            <label for="website" id="label-website">Portfolio/LinkedIn</label>
                            <input type="text" id="website" placeholder="linkedin.com/in/johndoe">
                        </div>
                        <div class="input-group full-width">
                            <label for="summary" id="label-summary">Professional Summary</label>
                            <textarea id="summary"
                                placeholder="Briefly describe your expertise and value..."></textarea>
                        </div>
                    </div>
                </section>

                <!-- Experience Section -->
                <section class="form-section">
                    <div class="section-title">
                        <h2 id="label-experience">Work Experience</h2>
                        <button type="button" class="add-btn" id="add-experience">+ Add</button>
                    </div>
                    <div id="experience-list" class="repeater-list"></div>
                </section>

                <!-- Education Section -->
                <section class="form-section">
                    <div class="section-title">
                        <h2 id="label-education">Education</h2>
                        <button type="button" class="add-btn" id="add-education">+ Add</button>
                    </div>
                    <div id="education-list" class="repeater-list"></div>
                </section>

                <!-- Skills Section -->
                <section class="form-section">
                    <div class="section-title">
                        <h2 id="label-skills">Skills</h2>
                    </div>
                    <div id="skills-container" class="input-group full-width">
                        <label for="skills" id="label-skills-label">Skills (comma separated)</label>
                        <input type="text" id="skills" placeholder="UI/UX Design, React, Node.js">
                    </div>
                </section>
            </form>

            <footer class="sidebar-footer">
                <button id="download-btn" class="primary-btn">Download PDF</button>
            </footer>
        </aside>

        <!-- Preview Area -->
        <main class="preview-area">
            <div id="cv-preview" class="cv-page">
                <div class="cv-header">
                    <div class="header-main">
                        <div id="preview-avatar-container" class="avatar-container hidden">
                            <img id="preview-avatar" src="" alt="Profile Photo">
                        </div>
                        <div class="header-text">
                            <h1 id="preview-name">Your Name</h1>
                            <p id="preview-title" class="preview-role">Your Job Title</p>
                        </div>
                    </div>
                    <div class="header-contact">
                        <span id="preview-email">email@example.com</span>
                        <span id="preview-phone">00000000</span>
                        <span id="preview-location">Location</span>
                        <span id="preview-website">website.com</span>
                    </div>
                </div>

                <div class="cv-body">
                    <div class="cv-main">
                        <section class="cv-section">
                            <h3 id="preview-label-summary">Professional Summary</h3>
                            <div class="section-divider"></div>
                            <p id="preview-summary">A brief introduction about your career journey...</p>
                        </section>

                        <section class="cv-section">
                            <h3 id="preview-label-experience">Experience</h3>
                            <div class="section-divider"></div>
                            <div id="preview-experience-list" class="preview-list"></div>
                        </section>
                    </div>

                    <div class="cv-sidebar">
                        <section class="cv-section">
                            <h3 id="preview-label-skills">Skills</h3>
                            <div class="section-divider"></div>
                            <div id="preview-skills-list" class="skills-grid"></div>
                        </section>

                        <section class="cv-section">
                            <h3 id="preview-label-education">Education</h3>
                            <div class="section-divider"></div>
                            <div id="preview-education-list" class="preview-list"></div>
                        </section>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
